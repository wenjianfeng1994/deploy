<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>围棋对弈</title>
<style>
  :root{
    --bg:#f4f1ea;
    --card:#ffffff;
    --ink:#2c2620;
    --muted:#8b7d6b;
    --line:#e7e0d4;
    --accent:#1f6f4a;
    --accent-soft:#e9f2ed;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:26px 20px 46px;
    min-height:100vh;
    background:
      radial-gradient(900px 500px at 50% -12%, #fffdf7 0%, rgba(255,253,247,0) 70%),
      var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:1060px;margin:0 auto;}
  header{display:flex;align-items:baseline;gap:14px;margin:0 0 20px 4px;flex-wrap:wrap;}
  h1{margin:0;font-size:23px;font-weight:600;letter-spacing:.18em;}
  .sub{font-size:12.5px;color:var(--muted);}

  .main{display:flex;gap:22px;align-items:flex-start;}
  .board-card{
    position:relative;
    flex:1 1 460px;
    min-width:0;
    max-width:660px;
    aspect-ratio:1/1;
    padding:10px;
    background:var(--card);
    border-radius:20px;
    box-shadow:0 30px 60px -34px rgba(83,58,26,.55), 0 2px 8px rgba(83,58,26,.06);
  }
  canvas{width:100%;height:100%;display:block;border-radius:12px;cursor:crosshair;touch-action:manipulation;}

  .side{flex:0 0 288px;display:flex;flex-direction:column;gap:12px;}
  @media (max-width:820px){
    .main{flex-direction:column;align-items:stretch;}
    .side{flex:1 1 auto;}
    .board-card{max-width:none;}
    body{padding:18px 14px 34px;}
  }

  .card{
    background:var(--card);
    border-radius:16px;
    padding:14px 16px;
    box-shadow:0 16px 32px -28px rgba(83,58,26,.5), 0 1px 3px rgba(83,58,26,.06);
  }

  .players{padding:8px;display:flex;flex-direction:column;gap:4px;}
  .player{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:11px;transition:background .2s;}
  .player.active{background:var(--accent-soft);}
  .dot{width:15px;height:15px;border-radius:50%;flex:none;}
  .dot.black{background:radial-gradient(circle at 32% 30%, #6d6d6d, #111 72%);}
  .dot.white{background:radial-gradient(circle at 32% 30%, #fff, #d5d0c7 82%);box-shadow:inset 0 0 0 1px rgba(0,0,0,.14);}
  .pname{font-size:13.5px;font-weight:500;}
  .cap{margin-left:auto;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;}

  .status-line{font-size:15px;font-weight:600;}
  .hint{margin-top:6px;font-size:12.5px;color:var(--muted);min-height:18px;}

  .score-title{font-size:12.5px;color:var(--muted);margin-bottom:6px;}
  .score-row{display:flex;justify-content:space-between;font-size:13.5px;padding:6px 0;font-variant-numeric:tabular-nums;}
  .score-row + .score-row{border-top:1px dashed var(--line);}
  .verdict{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:14px;font-weight:600;color:var(--accent);}

  .controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px;}
  button{
    font:inherit;font-size:13.5px;padding:9px 10px;border-radius:10px;
    border:1px solid var(--line);background:#fbf9f5;color:var(--ink);
    cursor:pointer;transition:background .18s,border-color .18s,transform .06s;
  }
  button:hover{background:#f3eee6;border-color:#dbd1c0;}
  button:active{transform:translateY(1px);}
  button:disabled{opacity:.4;cursor:not-allowed;transform:none;}

  .seg-row{display:flex;align-items:center;justify-content:space-between;padding:4px 0;}
  .seg-row + .seg-row{margin-top:4px;}
  .seg-row > span{font-size:12.5px;color:var(--muted);}
  .seg{display:flex;background:#f4f0e8;border-radius:9px;padding:3px;gap:2px;}
  .seg button{border:0;background:transparent;padding:5px 11px;border-radius:7px;font-size:12.5px;color:var(--muted);}
  .seg button:hover{background:transparent;color:var(--ink);}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(83,58,26,.16);}

  .log-card{padding:14px 10px 10px 16px;}
  .log-title{font-size:12.5px;color:var(--muted);margin-bottom:8px;}
  .log{
    max-height:150px;overflow-y:auto;padding-right:6px;
    display:grid;grid-template-columns:1fr 1fr;gap:1px 10px;font-size:12.5px;
  }
  .log::-webkit-scrollbar{width:6px;}
  .log::-webkit-scrollbar-thumb{background:#ded4c4;border-radius:3px;}
  .log-item{display:flex;align-items:center;gap:6px;color:#5b5045;font-variant-numeric:tabular-nums;padding:2px 0;}
  .log-item .idx{color:#bdb0a0;font-size:11px;width:20px;text-align:right;flex:none;}
  .sd{width:9px;height:9px;border-radius:50%;flex:none;}
  .sd.b{background:#1a1a1a;}
  .sd.w{background:#fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);}
  .log-empty{grid-column:1/-1;color:#c3b6a4;font-size:12.5px;padding:4px 0;}

  .toast{
    position:absolute;left:50%;top:18px;transform:translate(-50%,-10px);
    background:rgba(44,38,32,.92);color:#fff;font-size:13px;padding:8px 16px;
    border-radius:999px;opacity:0;pointer-events:none;transition:.22s;z-index:5;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>围 棋</h1>
    <span class="sub">点击交叉点落子 · 双方连续停一手即按中国规则数子结算</span>
  </header>

  <div class="main">
    <div class="board-card" id="boardCard">
      <canvas id="board"></canvas>
      <div class="toast" id="toast"></div>
    </div>

    <div class="side">
      <div class="card players">
        <div class="player" id="p1">
          <span class="dot black"></span>
          <span class="pname" id="name1">黑棋</span>
          <span class="cap" id="cap1">提 0</span>
        </div>
        <div class="player" id="p2">
          <span class="dot white"></span>
          <span class="pname" id="name2">白棋</span>
          <span class="cap" id="cap2">提 0</span>
        </div>
      </div>

      <div class="card">
        <div class="status-line" id="statusText">黑棋行棋</div>
        <div class="hint" id="hintText">点击棋盘落子</div>
      </div>

      <div class="card" id="scoreCard" style="display:none">
        <div class="score-title">中国规则数子法</div>
        <div class="score-row"><span>黑</span><span id="scoreB">—</span></div>
        <div class="score-row"><span>白（含贴目 7.5）</span><span id="scoreW">—</span></div>
        <div class="verdict" id="verdict">—</div>
      </div>

      <div class="card controls">
        <button id="btnUndo">悔棋</button>
        <button id="btnPass">停一手</button>
        <button id="btnResign">认输</button>
        <button id="btnNew">新对局</button>
      </div>

      <div class="card">
        <div class="seg-row">
          <span>模式</span>
          <div class="seg" id="segMode">
            <button data-mode="pvc" class="on">人机</button>
            <button data-mode="pvp">双人</button>
          </div>
        </div>
        <div class="seg-row">
          <span>棋盘</span>
          <div class="seg" id="segSize">
            <button data-size="9">9 路</button>
            <button data-size="13">13 路</button>
            <button data-size="19" class="on">19 路</button>
          </div>
        </div>
      </div>

      <div class="card log-card">
        <div class="log-title">行棋记录</div>
        <div class="log" id="log"></div>
      </div>
    </div>
  </div>
</div>

<script>
/* =====================================================================
   围棋核心
   ===================================================================== */
const KOMI = 7.5;                                   // 贴目（中国规则 3.75 子）
const COLS = 'ABCDEFGHJKLMNOPQRST';                 // 跳过字母 I
const DIRS = [[1,0],[-1,0],[0,1],[0,-1]];

const state = {
  N: 19,
  board: [],
  turn: 1,                    // 1 黑  2 白
  captures: {1:0, 2:0},       // 各方提子数
  lastMove: null,
  passes: 0,
  over: false,
  mode: 'pvc',                // pvc 人机 / pvp 双人
  aiColor: 2,
  history: [],                // 悔棋快照
  positions: [],              // 历史局面，用于「全局同形」禁着
  log: [],
  result: null,
};
let thinking = false;

const boardEl = document.getElementById('board');
const ctx = boardEl.getContext('2d');
const geom = { size: 0, pad: 0, grid: 0 };
let hover = null;

/* ---------- 基础工具 ---------- */

function makeBoard(N){
  return Array.from({length:N}, () => new Array(N).fill(0));
}

function boardKey(b){
  let s = '';
  for (let y=0; y<b.length; y++){
    const row = b[y];
    for (let x=0; x<row.length; x++) s += row[x];
  }
  return s;
}

// 求同色连通块：返回成员坐标与气的数量
function group(b, x, y, N){
  const color = b[y][x];
  const seen = new Uint8Array(N*N);
  const stones = [];
  const libs = new Set();
  const stack = [[x, y]];
  seen[y*N + x] = 1;

  while (stack.length){
    const [cx, cy] = stack.pop();
    stones.push([cx, cy]);
    for (let d=0; d<4; d++){
      const nx = cx + DIRS[d][0], ny = cy + DIRS[d][1];
      if (nx < 0 || ny < 0 || nx >= N || ny >= N) continue;
      const v = b[ny][nx];
      if (v === 0) libs.add(ny*N + nx);
      else if (v === color && !seen[ny*N + nx]){
        seen[ny*N + nx] = 1;
        stack.push([nx, ny]);
      }
    }
  }
  return { stones, libs: libs.size };
}

/**
 * 试下（不改变棋局状态）
 * 规则顺序：空点 → 提对方无气块 → 自杀检查 → 全局同形（打劫）禁着
 */
function tryPlay(x, y, color, skipSuperko){
  const N = state.N;
  if (x < 0 || y < 0 || x >= N || y >= N) return { ok:false, err:'越界' };
  if (state.board[y][x] !== 0) return { ok:false, err:'这里已经有棋子了' };

  const b = state.board.map(r => r.slice());
  b[y][x] = color;
  const opp = 3 - color;
  let captured = 0;

  for (let d=0; d<4; d++){
    const nx = x + DIRS[d][0], ny = y + DIRS[d][1];
    if (nx < 0 || ny < 0 || nx >= N || ny >= N) continue;
    if (b[ny][nx] !== opp) continue;
    const g = group(b, nx, ny, N);
    if (g.libs === 0){
      for (const [gx, gy] of g.stones){ b[gy][gx] = 0; captured++; }
    }
  }

  if (captured === 0){
    const self = group(b, x, y, N);
    if (self.libs === 0) return { ok:false, err:'禁着点（自杀）' };
  }

  const key = boardKey(b);
  if (!skipSuperko && state.positions.includes(key)){
    return { ok:false, err:'打劫禁着（全局同形）' };
  }
  return { ok:true, board:b, captured, key };
}

/* ---------- 落子 / 停一手 / 结算 ---------- */

function snapshot(){
  return {
    board: state.board,               // 旧数组引用，后续不会被改写
    turn: state.turn,
    captures: {...state.captures},
    lastMove: state.lastMove,
    passes: state.passes,
    posLen: state.positions.length,
    logLen: state.log.length,
  };
}

function commit(x, y, color, res){
  state.history.push(snapshot());
  state.board = res.board;
  state.captures[color] += res.captured;
  state.turn = 3 - color;
  state.lastMove = {x, y, color};
  state.passes = 0;
  state.positions.push(res.key);
  state.log.push({ x, y, color, captured: res.captured });
  draw();
  updateUI();
  maybeAI();
}

function playMove(x, y, color){
  const res = tryPlay(x, y, color);
  if (!res.ok){
    toast(res.err);
    return false;
  }
  if (res.captured > 0) toast(`提 ${res.captured} 子`);
  commit(x, y, color, res);
  return true;
}

function passTurn(color){
  if (state.over) return;
  state.history.push(snapshot());
  state.turn = 3 - color;
  state.passes += 1;
  state.lastMove = null;
  state.log.push({ x:null, y:null, color, pass:true });
  draw();
  updateUI();
  if (state.passes >= 2){
    endGame();
  } else {
    toast('停一手');
    maybeAI();
  }
}

function resign(color){
  if (state.over) return;
  const winner = 3 - color;
  state.over = true;
  state.result = { type:'resign', winner, text:`${winner === 1 ? '黑' : '白'}胜 · 对方认输` };
  state.log.push({ x:null, y:null, color, resign:true });
  draw();
  updateUI();
}

// 中国规则数子：子 + 空（归一方独占的空点）
function computeScore(){
  const N = state.N, b = state.board;
  const visited = Array.from({length:N}, () => new Uint8Array(N));
  let black = 0, white = 0, blackT = 0, whiteT = 0, dame = 0;

  for (let y=0; y<N; y++) for (let x=0; x<N; x++){
    if (b[y][x] === 1){ black++; visited[y][x] = 1; }
    else if (b[y][x] === 2){ white++; visited[y][x] = 1; }
  }

  for (let y=0; y<N; y++) for (let x=0; x<N; x++){
    if (visited[y][x]) continue;
    const stack = [[x, y]];
    visited[y][x] = 1;
    let size = 0, touchB = false, touchW = false;

    while (stack.length){
      const [cx, cy] = stack.pop();
      size++;
      for (let d=0; d<4; d++){
        const nx = cx + DIRS[d][0], ny = cy + DIRS[d][1];
        if (nx < 0 || ny < 0 || nx >= N || ny >= N) continue;
        const v = b[ny][nx];
        if (v === 1) touchB = true;
        else if (v === 2) touchW = true;
        else if (!visited[ny][nx]){ visited[ny][nx] = 1; stack.push([nx, ny]); }
      }
    }

    if (touchB && !touchW){ black += size; blackT += size; }
    else if (touchW && !touchB){ white += size; whiteT += size; }
    else dame += size;
  }

  const whiteTotal = white + KOMI;
  return { black, white, blackT, whiteT, dame, whiteTotal, diff: black - whiteTotal };
}

function endGame(){
  const s = computeScore();
  state.over = true;
  const winner = s.diff > 0 ? 1 : 2;
  const margin = Math.abs(s.diff).toFixed(1);
  state.result = {
    type: 'score', winner, score: s,
    text: `${winner === 1 ? '黑' : '白'}胜 ${margin} 目`
  };
  draw();
  updateUI();
  toast(state.result.text);
}

/* ---------- 悔棋 / 新局 ---------- */

function undoOne(){
  if (!state.history.length) return false;
  const h = state.history.pop();
  state.board = h.board;
  state.turn = h.turn;
  state.captures = h.captures;
  state.lastMove = h.lastMove;
  state.passes = h.passes;
  state.positions.length = h.posLen;
  state.log.length = h.logLen;
  state.over = false;
  state.result = null;
  return true;
}

function undo(){
  if (thinking) return;
  if (!undoOne()){
    toast('已经退到起点了');
    return;
  }
  // 人机模式下退到「轮到自己」的那一手
  if (state.mode === 'pvc' && state.turn === state.aiColor && state.history.length){
    undoOne();
  }
  draw();
  updateUI();
}

function newGame(N){
  state.N = N || state.N;
  state.board = makeBoard(state.N);
  state.turn = 1;
  state.captures = {1:0, 2:0};
  state.lastMove = null;
  state.passes = 0;
  state.over = false;
  state.result = null;
  state.history = [];
  state.positions = [boardKey(state.board)];
  state.log = [];
  hover = null;
  thinking = false;
  layout();
  updateUI();
  maybeAI();
}

/* =====================================================================
   简单 AI：启发式打分，优先提子 / 延气 / 贴身接触 / 三路线
   ===================================================================== */

function isOwnEye(x, y, color){
  const N = state.N, b = state.board;
  for (const [dx, dy] of DIRS){
    const nx = x + dx, ny = y + dy;
    if (nx < 0 || ny < 0 || nx >= N || ny >= N) continue;   // 边界算作己方
    if (b[ny][nx] !== color) return false;
  }
  let own = 0, enemy = 0;
  for (const [dx, dy] of [[1,1],[1,-1],[-1,1],[-1,-1]]){
    const nx = x + dx, ny = y + dy;
    if (nx < 0 || ny < 0 || nx >= N || ny >= N) continue;
    if (b[ny][nx] === color) own++;
    else if (b[ny][nx] === 3 - color) enemy++;
  }
  return enemy === 0 || own >= 2;
}

function starSet(N){
  const pts = new Set();
  let lines;
  if (N === 19) lines = [3, 9, 15];
  else if (N === 13) lines = [3, 6, 9];
  else lines = [2, 4, 6];
  for (const x of lines) for (const y of lines) pts.add(y*N + x);
  return pts;
}

function aiThink(){
  const color = state.aiColor;
  const opp = 3 - color;
  const N = state.N, b = state.board;
  const stars = starSet(N);
  const stoneCount = b.flat().filter(v => v !== 0).length;
  const opening = stoneCount < N * 1.2;

  let best = null, bestScore = -Infinity;
  let candidates = 0;

  for (let y=0; y<N; y++) for (let x=0; x<N; x++){
    if (b[y][x] !== 0) continue;
    if (isOwnEye(x, y, color)) continue;

    const res = tryPlay(x, y, color, true);
    if (!res.ok) continue;
    candidates++;

    let s = 0;

    // 1. 提子价值极高
    s += res.captured * 70;

    // 2. 落子后自身的气
    const g = group(res.board, x, y, N);
    s += Math.min(g.libs, 6) * 7;
    if (g.libs === 1) s -= 55;               // 自紧气，危险
    if (g.libs === 2) s -= 8;

    // 3. 打吃对方
    let atari = 0, adjOpp = 0, adjOwn = 0;
    for (let d=0; d<4; d++){
      const nx = x + DIRS[d][0], ny = y + DIRS[d][1];
      if (nx < 0 || ny < 0 || nx >= N || ny >= N) continue;
      if (res.board[ny][nx] === opp){
        adjOpp++;
        const og = group(res.board, nx, ny, N);
        if (og.libs === 1) atari++;
      } else if (res.board[ny][nx] === color){
        adjOwn++;
      }
    }
    s += atari * 24;
    s += adjOpp * 6 + adjOwn * 2;            // 贴身接触战 / 连接

    // 4. 二格内的势力影响
    for (let dy=-2; dy<=2; dy++) for (let dx=-2; dx<=2; dx++){
      const dist = Math.abs(dx) + Math.abs(dy);
      if (dist === 0 || dist > 2) continue;
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || ny < 0 || nx >= N || ny >= N) continue;
      if (b[ny][nx] === opp) s += (3 - dist) * 2.2;
      else if (b[ny][nx] === color) s += (3 - dist) * 1.1;
    }

    // 5. 线位偏好：三、四线最优，一路最差
    const lineNo = Math.min(x, y, N-1-x, N-1-y);
    if (lineNo === 0) s -= 18;
    else if (lineNo === 1) s -= 6;
    else if (lineNo === 2) s += 7;
    else if (lineNo === 3) s += 6;
    else s -= 1;

    // 6. 布局阶段偏爱星位
    if (opening && stars.has(y*N + x)) s += 10;

    // 7. 一点随机，避免每局一模一样
    s += Math.random() * 6;

    if (s > bestScore){ bestScore = s; best = {x, y}; }
  }

  if (!candidates) return null;
  return best;
}

function maybeAI(){
  if (state.mode !== 'pvc' || state.over || state.turn !== state.aiColor) return;
  thinking = true;
  updateUI();
  setTimeout(() => {
    if (state.over || state.turn !== state.aiColor){ thinking = false; updateUI(); return; }
    const mv = aiThink();
    thinking = false;
    if (mv && playMove(mv.x, mv.y, state.aiColor)) return;
    // 无合适着点 → 停一手
    if (!state.over) passTurn(state.aiColor);
  }, 280);
}

/* =====================================================================
   绘制
   ===================================================================== */

function px(i){ return geom.pad + i * geom.grid; }
function py(i){ return geom.pad + i * geom.grid; }

function layout(){
  const rect = boardEl.getBoundingClientRect();
  const size = Math.round(Math.min(rect.width, rect.height));
  if (!size) return;
  const dpr = window.devicePixelRatio || 1;
  boardEl.width = Math.round(size * dpr);
  boardEl.height = Math.round(size * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const N = state.N;
  geom.size = size;
  geom.pad = size * 0.072;
  geom.grid = (size - 2 * geom.pad) / (N - 1);
  draw();
}

let seed = 20261115;
function rnd(){
  seed = (seed * 9301 + 49297) % 233280;
  return seed / 233280;
}

function drawWood(size){
  const g = ctx.createLinearGradient(0, 0, size, size);
  g.addColorStop(0, '#ecc684');
  g.addColorStop(0.42, '#e4b76d');
  g.addColorStop(1, '#d7a457');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, size, size);

  // 木纹
  ctx.save();
  ctx.globalAlpha = 0.055;
  ctx.strokeStyle = '#8a5a20';
  seed = 20261115;
  for (let i=0; i<24; i++){
    const y0 = rnd() * size;
    ctx.beginPath();
    ctx.lineWidth = 0.8 + rnd() * 2;
    ctx.moveTo(-10, y0);
    ctx.bezierCurveTo(
      size * 0.3, y0 + (rnd() - 0.5) * 46,
      size * 0.7, y0 + (rnd() - 0.5) * 46,
      size + 10, y0 + (rnd() - 0.5) * 24
    );
    ctx.stroke();
  }
  ctx.restore();

  // 四周压暗一点，显得有厚度
  const vg = ctx.createRadialGradient(size/2, size/2, size*0.32, size/2, size/2, size*0.78);
  vg.addColorStop(0, 'rgba(120,80,30,0)');
  vg.addColorStop(1, 'rgba(120,80,30,.14)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, size, size);
}

function drawStone(x, y, color, alpha){
  const cx = px(x), cy = py(y);
  const r = geom.grid * 0.475;
  ctx.save();
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;

  ctx.shadowColor = 'rgba(70,45,15,.38)';
  ctx.shadowBlur = r * 0.5;
  ctx.shadowOffsetY = r * 0.14;

  const g = ctx.createRadialGradient(cx - r*0.33, cy - r*0.37, r*0.08, cx, cy, r*1.02);
  if (color === 1){
    g.addColorStop(0, '#7a7a7a');
    g.addColorStop(0.45, '#313131');
    g.addColorStop(1, '#050505');
  } else {
    g.addColorStop(0, '#ffffff');
    g.addColorStop(0.55, '#f6f3ee');
    g.addColorStop(1, '#cbc4ba');
  }
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = g;
  ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.shadowBlur = 0;
  ctx.shadowOffsetY = 0;

  if (color === 2){
    ctx.strokeStyle = 'rgba(110,88,52,.28)';
    ctx.lineWidth = Math.max(0.6, r * 0.055);
    ctx.stroke();
  }

  // 高光
  const hg = ctx.createRadialGradient(cx - r*0.3, cy - r*0.34, 0, cx - r*0.3, cy - r*0.34, r*0.62);
  hg.addColorStop(0, color === 1 ? 'rgba(255,255,255,.30)' : 'rgba(255,255,255,.95)');
  hg.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = hg;
  ctx.fill();

  ctx.restore();
}

function draw(){
  const { size, pad, grid } = geom;
  const N = state.N;
  if (!size) return;

  ctx.clearRect(0, 0, size, size);
  drawWood(size);

  // 网格
  const thin = Math.max(0.8, size / 900);
  ctx.strokeStyle = 'rgba(58,38,16,.72)';
  ctx.lineWidth = thin;
  ctx.beginPath();
  for (let i=0; i<N; i++){
    ctx.moveTo(px(i), py(0));   ctx.lineTo(px(i), py(N-1));
    ctx.moveTo(px(0), py(i));   ctx.lineTo(px(N-1), py(i));
  }
  ctx.stroke();

  // 外框加粗
  ctx.lineWidth = thin * 2;
  ctx.strokeRect(pad, pad, grid * (N-1), grid * (N-1));

  // 星位
  const stars = starSet(N);
  ctx.fillStyle = 'rgba(45,28,10,.85)';
  const dotR = Math.max(1.4, grid * 0.075);
  stars.forEach(k => {
    const x = k % N, y = Math.floor(k / N);
    ctx.beginPath();
    ctx.arc(px(x), py(y), dotR, 0, Math.PI * 2);
    ctx.fill();
  });

  // 坐标
  ctx.fillStyle = 'rgba(95,62,20,.72)';
  ctx.font = `${Math.max(9, Math.round(size * 0.026))}px -apple-system, "PingFang SC", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const labelR = pad * 0.5;
  for (let i=0; i<N; i++){
    ctx.fillText(COLS[i], px(i), labelR);
    ctx.fillText(COLS[i], px(i), size - labelR);
    ctx.fillText(String(N - i), labelR, py(i));
    ctx.fillText(String(N - i), size - labelR, py(i));
  }

  // 落子预览
  if (hover && !state.over && !thinking && state.board[hover.y][hover.x] === 0){
    const humanTurn = state.mode === 'pvp' || state.turn !== state.aiColor;
    if (humanTurn) drawStone(hover.x, hover.y, state.turn, 0.38);
  }

  // 棋子
  for (let y=0; y<N; y++) for (let x=0; x<N; x++){
    const v = state.board[y][x];
    if (v) drawStone(x, y, v, 1);
  }

  // 最后一手标记
  if (state.lastMove){
    const { x, y } = state.lastMove;
    ctx.beginPath();
    ctx.arc(px(x), py(y), Math.max(2.2, grid * 0.13), 0, Math.PI * 2);
    ctx.fillStyle = '#e0452f';
    ctx.fill();
  }
}

/* =====================================================================
   交互
   ===================================================================== */

function eventPoint(e){
  const rect = boardEl.getBoundingClientRect();
  const scale = geom.size / rect.width;
  return { mx: (e.clientX - rect.left) * scale, my: (e.clientY - rect.top) * scale };
}

function pickPoint(mx, my){
  const N = state.N;
  const gx = Math.round((mx - geom.pad) / geom.grid);
  const gy = Math.round((my - geom.pad) / geom.grid);
  if (gx < 0 || gy < 0 || gx >= N || gy >= N) return null;
  const dx = mx - px(gx), dy = my - py(gy);
  if (Math.hypot(dx, dy) > geom.grid * 0.55) return null;
  return { x: gx, y: gy };
}

boardEl.addEventListener('mousemove', e => {
  const { mx, my } = eventPoint(e);
  const p = pickPoint(mx, my);
  const changed = (p && (!hover || p.x !== hover.x || p.y !== hover.y)) || (!p && hover);
  hover = p;
  if (changed){
    draw();
    if (p) setHint(`坐标 ${COLS[p.x]}${state.N - p.y}`);
    else setHint(defaultHint());
  }
});

boardEl.addEventListener('mouseleave', () => {
  hover = null;
  draw();
  setHint(defaultHint());
});

boardEl.addEventListener('click', e => {
  if (state.over){ toast('对局已结束，点「新对局」再来一盘'); return; }
  if (thinking) return;
  if (state.mode === 'pvc' && state.turn === state.aiColor) return;

  const { mx, my } = eventPoint(e);
  const p = pickPoint(mx, my);
  if (!p) return;
  playMove(p.x, p.y, state.turn);
});

document.getElementById('btnUndo').onclick = undo;
document.getElementById('btnPass').onclick = () => {
  if (state.over){ toast('对局已结束'); return; }
  if (thinking) return;
  if (state.mode === 'pvc' && state.turn === state.aiColor) return;
  passTurn(state.turn);
};
document.getElementById('btnResign').onclick = () => {
  if (state.over){ toast('对局已结束'); return; }
  resign(state.turn);
};
document.getElementById('btnNew').onclick = () => newGame(state.N);

document.getElementById('segMode').addEventListener('click', e => {
  const btn = e.target.closest('button[data-mode]');
  if (!btn) return;
  state.mode = btn.dataset.mode;
  [...e.currentTarget.children].forEach(b => b.classList.toggle('on', b === btn));
  newGame(state.N);
});

document.getElementById('segSize').addEventListener('click', e => {
  const btn = e.target.closest('button[data-size]');
  if (!btn) return;
  [...e.currentTarget.children].forEach(b => b.classList.toggle('on', b === btn));
  newGame(Number(btn.dataset.size));
});

window.addEventListener('keydown', e => {
  if (e.key === 'u' || e.key === 'U' || e.key === 'Backspace'){ e.preventDefault(); undo(); }
  else if (e.key === 'p' || e.key === 'P'){ document.getElementById('btnPass').click(); }
  else if (e.key === 'n' || e.key === 'N'){ newGame(state.N); }
});

/* =====================================================================
   UI 刷新
   ===================================================================== */

let toastTimer = null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1500);
}

function setHint(t){
  document.getElementById('hintText').textContent = t;
}

function defaultHint(){
  if (state.over) return '对局结束';
  if (thinking) return 'AI 正在思考…';
  if (state.mode === 'pvc') return state.turn === state.aiColor ? 'AI 行棋中' : '点击棋盘落子';
  return '点击棋盘落子';
}

function coordName(m){
  return `${COLS[m.x]}${state.N - m.y}`;
}

function updateUI(){
  document.getElementById('name1').textContent = state.mode === 'pvc' ? '黑棋（你）' : '黑棋';
  document.getElementById('name2').textContent = state.mode === 'pvc' ? '白棋（AI）' : '白棋';
  document.getElementById('cap1').textContent = `提 ${state.captures[1]}`;
  document.getElementById('cap2').textContent = `提 ${state.captures[2]}`;

  document.getElementById('p1').classList.toggle('active', state.turn === 1 && !state.over);
  document.getElementById('p2').classList.toggle('active', state.turn === 2 && !state.over);

  const st = document.getElementById('statusText');
  if (state.over && state.result){
    st.textContent = state.result.text;
  } else {
    st.textContent = `${state.turn === 1 ? '黑棋' : '白棋'}行棋`;
  }
  setHint(defaultHint());

  // 比分卡
  const card = document.getElementById('scoreCard');
  if (state.over && state.result){
    card.style.display = 'block';
    if (state.result.type === 'score'){
      const s = state.result.score;
      document.getElementById('scoreB').textContent = `${s.black} 目`;
      document.getElementById('scoreW').textContent = `${s.whiteTotal.toFixed(1)} 目`;
      document.getElementById('verdict').textContent = state.result.text;
    } else {
      document.getElementById('scoreB').textContent = '—';
      document.getElementById('scoreW').textContent = '—';
      document.getElementById('verdict').textContent = state.result.text;
    }
  } else {
    card.style.display = 'none';
  }

  // 记录
  const logEl = document.getElementById('log');
  if (!state.log.length){
    logEl.innerHTML = '<div class="log-empty">尚未落子</div>';
  } else {
    logEl.innerHTML = state.log.map((m, i) => {
      const side = m.color === 1 ? 'b' : 'w';
      const label = m.pass ? '停一手' : (m.resign ? '认输' : coordName(m));
      const cap = m.captured ? `<span style="color:#c26a4a;font-size:11px">+${m.captured}</span>` : '';
      return `<div class="log-item"><span class="idx">${i+1}</span><span class="sd ${side}"></span><span>${label}</span>${cap}</div>`;
    }).join('');
    logEl.scrollTop = logEl.scrollHeight;
  }

  document.getElementById('btnUndo').disabled = state.history.length === 0 || thinking;
  document.getElementById('btnPass').disabled = state.over || thinking;
  document.getElementById('btnResign').disabled = state.over;
}

/* =====================================================================
   启动
   ===================================================================== */

new ResizeObserver(() => layout()).observe(document.getElementById('boardCard'));
window.addEventListener('resize', layout);

newGame(19);
requestAnimationFrame(layout);
</script>
